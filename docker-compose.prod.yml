# Production build. Deploy with:
#   cp .env.example .env   # fill in JWT_SECRET and APP_ORIGIN
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only this proxy's HTTP port (80) is exposed to the host; a hosting-layer
# reverse proxy / load balancer terminates TLS and forwards to port 80.
# The API keeps all state in SQLite at /app/data (named volume foundermate_data).

services:
  api:
    build:
      context: .
      dockerfile: FounderMate.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/foundermate.db
      - Jwt__Secret=${JWT_SECRET:?JWT_SECRET must be set. Copy .env.example to .env and fill it in.}
      - Jwt__Issuer=FounderMate
      - Jwt__Audience=FounderMate
      - Jwt__ExpiryInMinutes=1440
      # The exact public origin(s) of the deployed frontend. Set APP_ORIGIN in
      # .env. Repeat the key with __1, __2, ... to allow more origins.
      - Cors__AllowedOrigins__0=${APP_ORIGIN:?APP_ORIGIN must be set (public origin of the deployed frontend).}
      - RateLimiting__Enabled=true
      - RateLimiting__PermitLimit=100
      - RateLimiting__WindowSeconds=60
      - ForwardedHeaders__KnownNetworks__0=172.16.0.0/12
      # MVP emails are written to the console only. To enable real email later,
      # set Email__Provider=SendGrid and provide Email__SendGridApiKey / Email__FromEmail.
      - Email__Provider=Console
    volumes:
      - foundermate_data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  foundermate_data: