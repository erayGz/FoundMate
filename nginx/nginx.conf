events {
    worker_connections 1024;
}

http {
    upstream api_backend {
        server api:8080;
    }

    # Rate limiting on the proxy edge
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    # Note: TLS is intentionally NOT terminated here. HTTPS is handled by the
    # hosting-layer reverse proxy / load balancer in front of this container;
    # it forwards plain HTTP to this proxy on the internal network.
    server {
        listen 80;

        # Security headers (kept for defense in depth; the edge proxy may add more)
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";

        # API endpoints
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection keep-alive;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Auth endpoints - stricter rate limiting
        location ~ ^/api/(users/(register|login)) {
            limit_req zone=auth burst=5 nodelay;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static files
        location /uploads/ {
            proxy_pass http://api_backend;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Health checks
        location = /health {
            proxy_pass http://api_backend;
            access_log off;
        }

        # Everything else
        location / {
            proxy_pass http://api_backend;
            access_log off;
        }
    }
}